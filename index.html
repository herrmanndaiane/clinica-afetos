<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda da Clínica - Reserva de Salas</title>
  <style>
    /* =========================================================
       1. ONDE AJUSTAR AS CORES DO SISTEMA
       ========================================================= */
    :root {
      --primary-color: #6b1d2f;    /* Bordô principal (Botões, Títulos, Cabeçalho) */
      --primary-hover: #501422;    /* Bordô mais escuro para o efeito de clique */
      --accent-color: #8b263e;     /* Bordô secundário (Aba ativa) */
      --bg-color: #ffffff;         /* Fundo da página (Branco) */
      --border-color: #e0e0e0;     /* Linhas e bordas da grade */
      --free-bg: #f4fbf7;          /* Fundo do turno Livre (Verde claro) */
      --free-border: #a8dab5;      /* Borda do turno Livre */
      --free-text: #1b5e20;        /* Texto do turno Livre */
      --busy-bg: #fdf2f4;          /* Fundo do turno Ocupado (Bordô bem suave) */
      --busy-border: #e5b0b9;      /* Borda do turno Ocupado */
      --busy-text: #6b1d2f;        /* Texto do turno Ocupado */
    }

    body {
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: #333333;
    }

    /* Tela de Login */
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }

    .login-card {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(107, 29, 47, 0.15);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 360px;
    }

    .login-card h2 {
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      color: var(--primary-color);
    }

    /* Cabeçalho e Logo */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      background: white;
      padding: 15px 20px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-img {
      max-height: 45px;
      max-width: 150px;
      object-fit: contain;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .btn {
      padding: 8px 16px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: white;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary-color);
      color: white;
      border: none;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-danger {
      background: #c62828;
      color: white;
      border: none;
    }

    .month-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--primary-color);
    }

    /* Abas das Salas */
    .tabs-container {
      display: flex;
      gap: 8px;
      margin-bottom: -1px;
    }

    .tab-btn {
      padding: 10px 20px;
      background: #f5f5f5;
      border: 1px solid var(--border-color);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      font-weight: bold;
      color: #666;
    }

    .tab-btn.active {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    /* Tabela da Semana (Estilo Google Calendar) */
    .calendar-grid {
      display: grid;
      grid-template-columns: 120px repeat(7, 1fr);
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 0 8px 8px 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .grid-header {
      background: #fafafa;
      padding: 12px;
      text-align: center;
      font-weight: bold;
      border-bottom: 2px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      color: var(--primary-color);
    }

    .grid-header.today {
      background: #fdf2f4;
      color: var(--primary-color);
    }

    .time-col {
      background: #fafafa;
      padding: 15px 10px;
      font-size: 0.85rem;
      font-weight: bold;
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
      color: #555;
    }

    .day-slot {
      padding: 8px;
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      min-height: 95px;
    }

    /* Cartões dos Turnos */
    .slot-card {
      height: 100%;
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      box-sizing: border-box;
    }

    .slot-card.livre {
      background: var(--free-bg);
      border: 1px dashed var(--free-border);
      color: var(--free-text);
    }

    .slot-card.ocupado {
      background: var(--busy-bg);
      border: 1px solid var(--busy-border);
      color: var(--busy-text);
    }

    .slot-title {
      font-weight: bold;
      font-size: 0.85rem;
    }

    .slot-info {
      font-size: 0.8rem;
      margin-top: 4px;
    }

    /* Modais */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 8px;
      width: 350px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .modal-content h3 { 
      margin-top: 0; 
      color: var(--primary-color); 
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 5px;
      font-weight: 500;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      box-sizing: border-box;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- Tela de Login -->
  <div class="login-container" id="telaLogin">
    <div class="login-card">
      <h2>Acesso à Agenda</h2>
      <form onsubmit="realizarLogin(event)">
        <div class="form-group">
          <label for="loginUsuario">Usuário</label>
          <select id="loginUsuario" required>
            <option value="">Selecione seu usuário...</option>
            <option value="karine">Karine</option>
            <option value="natalia">Natália</option>
            <option value="marilia">Marília</option>
            <option value="recepcao">Recepção</option>
          </select>
        </div>
        <div class="form-group">
          <label for="loginSenha">Senha</label>
          <input type="password" id="loginSenha" placeholder="Digite sua senha" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
      </form>
    </div>
  </div>

  <!-- Painel Principal (Calendário) -->
  <div id="painelCalendario" style="display: none;">
    <div class="header">
      <div class="nav-controls">
        <button class="btn" onclick="mudarSemana(-1)">&lt;</button>
        <button class="btn" onclick="semanaAtual()">Hoje</button>
        <button class="btn" onclick="mudarSemana(1)">&gt;</button>
        <span class="month-title" id="tituloMes">Setembro de 2026</span>
      </div>

      <div class="user-info">
        <!-- Logo e Envio da Logo -->
        <div class="logo-container">
          <img id="imgLogoTopo" class="logo-img" src="" alt="Logo" style="display: none;">
          <button class="btn" onclick="document.getElementById('inputUploadLogo').click()" style="font-size: 0.75rem; padding: 4px 8px;">📷 Logo</button>
          <input type="file" id="inputUploadLogo" accept="image/*" style="display: none;" onchange="uploadLogo(event)">
        </div>

        <span id="nomeUsuarioLogado" style="font-weight: bold; color: var(--primary-color);"></span>
        <button class="btn" onclick="abrirModalSenha()">🔑 Alterar Senha</button>
        <button class="btn" onclick="realizarLogout()">Sair</button>
      </div>
    </div>

    <!-- Abas das Salas -->
    <div class="tabs-container">
      <button class="tab-btn active" id="tabSala1" onclick="mudarSala('sala1')">Sala 01 - Maior</button>
      <button class="tab-btn" id="tabSala2" onclick="mudarSala('sala2')">Sala 02 - Compartilhada</button>
    </div>

    <!-- Grade do Calendário -->
    <div class="calendar-grid" id="calendarGrid">
      <!-- Renderizado via JS -->
    </div>
  </div>

  <!-- Modal para Inclusão/Edição de Reserva -->
  <div class="modal" id="modalReserva">
    <div class="modal-content">
      <h3 id="modalTitulo">Agendar Turno</h3>
      <input type="hidden" id="inputData">
      <input type="hidden" id="inputTurno">
      
      <div class="form-group">
        <label>Data e Horário</label>
        <input type="text" id="inputInfoDataHorario" readonly style="background: #f5f5f5;">
      </div>

      <div class="form-group">
        <label for="inputPsicologa">Profissional / Reservado para *</label>
        <input type="text" id="inputPsicologa" placeholder="Ex: Karine">
      </div>

      <div class="form-group">
        <label for="inputObs">Observação</label>
        <textarea id="inputObs" rows="3" placeholder="Atendimento presencial, consulta..."></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn btn-danger" id="btnExcluir" onclick="excluirReserva()" style="display:none;">Excluir</button>
        <button class="btn" onclick="fecharModal('modalReserva')">Cancelar</button>
        <button class="btn btn-primary" onclick="salvarReserva()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Modal para Alteração de Senha -->
  <div class="modal" id="modalSenha">
    <div class="modal-content">
      <h3>Alterar Minha Senha</h3>
      <div class="form-group">
        <label for="senhaAtual">Senha Atual *</label>
        <input type="password" id="senhaAtual">
      </div>
      <div class="form-group">
        <label for="novaSenha">Nova Senha *</label>
        <input type="password" id="novaSenha">
      </div>
      <div class="form-group">
        <label for="confirmarNovaSenha">Confirmar Nova Senha *</label>
        <input type="password" id="confirmarNovaSenha">
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="fecharModal('modalSenha')">Cancelar</button>
        <button class="btn btn-primary" onclick="salvarNovaSenha()">Atualizar Senha</button>
      </div>
    </div>
  </div>

  <script>
    const USUARIOS_PADRAO = {
      'karine':   { nome: 'Karine', senha: 'K@r1n3#' },
      'natalia':  { nome: 'Natália', senha: 'n@t4l!@' },
      'marilia':  { nome: 'Marília', senha: 'M4r!Li@' },
      'recepcao': { nome: 'Recepção', senha: 'R3c&pc@0' }
    };

    const JSONBIN_CONFIG = {
      binId: '65a12345abc',
      apiKey: '$2a$10$HB3aLXcmVDYDE89zOm.mvuITBZxSjg1WGqEI7FSyZNZLok4QE9t7.',
      url: 'https://api.jsonbin.io/v3/b/'
    };

    const TURNOS = [
      { id: 'manha', nome: 'Manhã', horario: '08:00 - 12:00' },
      { id: 'tarde', nome: 'Tarde', horario: '13:00 - 17:00' },
      { id: 'noite', nome: 'Noite', horario: '17:30 - 21:30' }
    ];

    let userKeyAtual = null;
    let salaAtual = 'sala1'; // 'sala1' ou 'sala2'
    let dataAtual = new Date();
    let dadosJsonBin = { reservas: [], usuarios: USUARIOS_PADRAO, logoUrl: '' };

    async function carregarDados() {
      try {
        const res = await fetch(`${JSONBIN_CONFIG.url}${JSONBIN_CONFIG.binId}/latest`, {
          headers: { 'X-Access-Key': JSONBIN_CONFIG.apiKey }
        });
        const json = await res.json();
        dadosJsonBin = json.record || {};
        
        if (!dadosJsonBin.reservas) dadosJsonBin.reservas = [];
        if (!dadosJsonBin.usuarios || !dadosJsonBin.usuarios.karine) dadosJsonBin.usuarios = USUARIOS_PADRAO;

        exibirLogo();
        verificarSessao();
      } catch (err) {
        console.error('Erro ao carregar dados:', err);
      }
    }

    async function guardarDados() {
      try {
        await fetch(`${JSONBIN_CONFIG.url}${JSONBIN_CONFIG.binId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Access-Key': JSONBIN_CONFIG.apiKey
          },
          body: JSON.stringify(dadosJsonBin)
        });
        if (userKeyAtual) renderizarCalendario();
      } catch (err) {
        alert('Erro ao guardar alterações.');
      }
    }

    /* Gestão da Logo */
    function uploadLogo(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        dadosJsonBin.logoUrl = e.target.result;
        exibirLogo();
        await guardarDados();
      };
      reader.readAsDataURL(file);
    }

    function exibirLogo() {
      const img = document.getElementById('imgLogoTopo');
      if (dadosJsonBin.logoUrl) {
        img.src = dadosJsonBin.logoUrl;
        img.style.display = 'block';
      } else {
        img.style.display = 'none';
      }
    }

    /* Abas das Salas */
    function mudarSala(idSala) {
      salaAtual = idSala;
      document.getElementById('tabSala1').classList.toggle('active', idSala === 'sala1');
      document.getElementById('tabSala2').classList.toggle('active', idSala === 'sala2');
      renderizarCalendario();
    }

    /* Login e Sessão */
    function realizarLogin(event) {
      event.preventDefault();
      const key = document.getElementById('loginUsuario').value;
      const senhaDigitada = document.getElementById('loginSenha').value;

      const usuarios = dadosJsonBin.usuarios || USUARIOS_PADRAO;

      if (usuarios[key] && usuarios[key].senha === senhaDigitada) {
        userKeyAtual = key;
        localStorage.setItem('usuarioLogadoKey', key);
        iniciarApp();
      } else {
        alert('Senha incorreta!');
      }
    }

    function verificarSessao() {
      const keySalva = localStorage.getItem('usuarioLogadoKey');
      const usuarios = dadosJsonBin.usuarios || USUARIOS_PADRAO;

      if (keySalva && usuarios[keySalva]) {
        userKeyAtual = keySalva;
        iniciarApp();
      } else {
        document.getElementById('telaLogin').style.display = 'flex';
        document.getElementById('painelCalendario').style.display = 'none';
      }
    }

    function realizarLogout() {
      localStorage.removeItem('usuarioLogadoKey');
      userKeyAtual = null;
      document.getElementById('telaLogin').style.display = 'flex';
      document.getElementById('painelCalendario').style.display = 'none';
      document.getElementById('loginSenha').value = '';
    }

    function iniciarApp() {
      const usuarios = dadosJsonBin.usuarios || USUARIOS_PADRAO;
      const usuarioLogado = usuarios[userKeyAtual];

      document.getElementById('telaLogin').style.display = 'none';
      document.getElementById('painelCalendario').style.display = 'block';
      document.getElementById('nomeUsuarioLogado').innerText = `👤 ${usuarioLogado.nome}`;
      renderizarCalendario();
    }

    /* Modal de Senha */
    function abrirModalSenha() {
      document.getElementById('senhaAtual').value = '';
      document.getElementById('novaSenha').value = '';
      document.getElementById('confirmarNovaSenha').value = '';
      document.getElementById('modalSenha').style.display = 'flex';
    }

    async function salvarNovaSenha() {
      const atual = document.getElementById('senhaAtual').value;
      const nova = document.getElementById('novaSenha').value;
      const confirmacao = document.getElementById('confirmarNovaSenha').value;

      const usuarioLogado = dadosJsonBin.usuarios[userKeyAtual];

      if (atual !== usuarioLogado.senha) {
        alert('A senha atual está incorreta.');
        return;
      }
      if (!nova || nova.length < 3) {
        alert('A nova senha deve ter no mínimo 3 caracteres.');
        return;
      }
      if (nova !== confirmacao) {
        alert('A confirmação não coincide com a nova senha.');
        return;
      }

      dadosJsonBin.usuarios[userKeyAtual].senha = nova;
      await guardarDados();

      alert('Senha alterada com sucesso!');
      fecharModal('modalSenha');
    }

    /* Renderização do Calendário */
    function getDiasDaSemana(dataRef) {
      const inicioSemana = new Date(dataRef);
      inicioSemana.setDate(dataRef.getDate() - dataRef.getDay());
      
      const dias = [];
      for (let i = 0; i < 7; i++) {
        const dia = new Date(inicioSemana);
        dia.setDate(inicioSemana.getDate() + i);
        dias.push(dia);
      }
      return dias;
    }

    function renderizarCalendario() {
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const diasSemana = getDiasDaSemana(dataAtual);
      const opcoesMes = { month: 'long', year: 'numeric' };
      document.getElementById('tituloMes').innerText = dataAtual.toLocaleDateString('pt-BR', opcoesMes);

      const headerVazio = document.createElement('div');
      headerVazio.className = 'grid-header';
      headerVazio.innerText = 'Turnos';
      grid.appendChild(headerVazio);

      const hoje = new Date().toISOString().split('T')[0];

      diasSemana.forEach(dia => {
        const dataIso = dia.toISOString().split('T')[0];
        const divHeader = document.createElement('div');
        divHeader.className = `grid-header ${dataIso === hoje ? 'today' : ''}`;
        
        const nomeDia = dia.toLocaleDateString('pt-BR', { weekday: 'short' }).toUpperCase();
        const numDia = dia.getDate();
        divHeader.innerHTML = `${nomeDia}<br><span style="font-size: 1.2rem">${numDia}</span>`;
        grid.appendChild(divHeader);
      });

      TURNOS.forEach(turno => {
        const divTime = document.createElement('div');
        divTime.className = 'time-col';
        divTime.innerHTML = `<strong>${turno.nome}</strong><br><small>${turno.horario}</small>`;
        grid.appendChild(divTime);

        diasSemana.forEach(dia => {
          const dataIso = dia.toISOString().split('T')[0];
          const divSlot = document.createElement('div');
          divSlot.className = 'day-slot';

          // Filtra pela data, pelo turno E PELA SALA ATUAL
          const reserva = dadosJsonBin.reservas.find(r => r.data === dataIso && r.turno === turno.id && (r.sala || 'sala1') === salaAtual);

          const card = document.createElement('div');
          if (reserva) {
            card.className = 'slot-card ocupado';
            card.innerHTML = `
              <div class="slot-title">${reserva.psicologa}</div>
              <div class="slot-info">${reserva.observacao || 'Reservado'}</div>
              <div style="font-size: 0.7rem; opacity: 0.8; margin-top: 4px;">Por: ${reserva.criadoPor || 'Sistema'}</div>
            `;
            card.onclick = () => abrirModalReserva(dataIso, turno, reserva);
          } else {
            card.className = 'slot-card livre';
            card.innerHTML = `
              <div class="slot-title">Disponível</div>
              <div class="slot-info">+ Clique p/ agendar</div>
            `;
            card.onclick = () => abrirModalReserva(dataIso, turno, null);
          }

          divSlot.appendChild(card);
          grid.appendChild(divSlot);
        });
      });
    }

    function mudarSemana(offset) {
      dataAtual.setDate(dataAtual.getDate() + (offset * 7));
      renderizarCalendario();
    }

    function semanaAtual() {
      dataAtual = new Date();
      renderizarCalendario();
    }

    /* Modal de Reservas */
    function abrirModalReserva(dataIso, turno, reserva) {
      document.getElementById('inputData').value = dataIso;
      document.getElementById('inputTurno').value = turno.id;
      
      const dataFmt = new Date(dataIso + 'T00:00:00').toLocaleDateString('pt-BR');
      const nomeSala = salaAtual === 'sala1' ? 'Sala 01 - Maior' : 'Sala 02 - Compartilhada';
      document.getElementById('inputInfoDataHorario').value = `${nomeSala} | ${dataFmt} (${turno.nome})`;

      const usuarioLogado = dadosJsonBin.usuarios[userKeyAtual];

      if (reserva) {
        document.getElementById('modalTitulo').innerText = 'Alterar / Excluir Reserva';
        document.getElementById('inputPsicologa').value = reserva.psicologa;
        document.getElementById('inputObs').value = reserva.observacao || '';
        document.getElementById('btnExcluir').style.display = 'inline-block';
      } else {
        document.getElementById('modalTitulo').innerText = 'Nova Reserva de Sala';
        document.getElementById('inputPsicologa').value = usuarioLogado.nome !== 'Recepção' ? usuarioLogado.nome : '';
        document.getElementById('inputObs').value = '';
        document.getElementById('btnExcluir').style.display = 'none';
      }

      document.getElementById('modalReserva').style.display = 'flex';
    }

    function fecharModal(idModal) {
      document.getElementById(idModal).style.display = 'none';
    }

    async function salvarReserva() {
      const dataIso = document.getElementById('inputData').value;
      const turnoId = document.getElementById('inputTurno').value;
      const psicologa = document.getElementById('inputPsicologa').value.trim();
      const observacao = document.getElementById('inputObs').value.trim();

      if (!psicologa) {
        alert('Por favor, informe o nome do profissional.');
        return;
      }

      // Remove reserva existente no mesmo dia, turno e sala
      dadosJsonBin.reservas = dadosJsonBin.reservas.filter(r => !(r.data === dataIso && r.turno === turnoId && (r.sala || 'sala1') === salaAtual));

      const usuarioLogado = dadosJsonBin.usuarios[userKeyAtual];

      dadosJsonBin.reservas.push({
        id: 'res_' + Date.now(),
        data: dataIso,
        turno: turnoId,
        sala: salaAtual,
        psicologa,
        observacao,
        criadoPor: usuarioLogado.nome,
        criadoEm: new Date().toISOString()
      });

      fecharModal('modalReserva');
      await guardarDados();
    }

    async function excluirReserva() {
      if (!confirm('Deseja realmente excluir esta reserva?')) return;

      const dataIso = document.getElementById('inputData').value;
      const turnoId = document.getElementById('inputTurno').value;

      dadosJsonBin.reservas = dadosJsonBin.reservas.filter(r => !(r.data === dataIso && r.turno === turnoId && (r.sala || 'sala1') === salaAtual));

      fecharModal('modalReserva');
      await guardarDados();
    }

    // Inicialização
    carregarDados();
  </script>
</body>
